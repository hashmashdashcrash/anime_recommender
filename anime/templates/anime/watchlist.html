{% extends 'anime/base.html' %}

{% block content %}

<h1>My Watchlist</h1>

{% for item in items %}
    <div class="card">
        <h2>{{ item.anime.title }}</h2>
        <p><strong>Genres:</strong> {{ item.anime.genres }}</p>
        <p><strong>Rating:</strong> {{ item.anime.rating }}</p>
        <a class="button" href="{% url 'anime_detail' item.anime.id %}">View Details</a>
        <a class="button" href="{% url 'remove_from_watchlist' item.anime.id %}">Remove</a>
    </div>
{% empty %}
    <p>Your watchlist is empty.</p>
{% endfor %}

{% endblock %}
