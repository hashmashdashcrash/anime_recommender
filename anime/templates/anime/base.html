<!DOCTYPE html>
<html>
<head>
    <title>Anime Watchlist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        nav {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #222;
        }

        nav a, nav span {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        .card {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .button {
            display: inline-block;
            padding: 8px 12px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 8px;
        }

        input, button {
            padding: 8px;
            margin: 5px 0;
        }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'anime_list' %}">Home</a>
    <a href="{% url 'recommendations' %}">Recommendations</a>

    {% if user.is_authenticated %}
        <a href="{% url 'watchlist' %}">My Watchlist</a>
        <a href="{% url 'logout' %}">Logout</a>
        <span>Logged in as {{ user.username }}</span>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
        <span>Not logged in</span>
    {% endif %}
</nav>

{% block content %}
{% endblock %}

</body>
</html>
